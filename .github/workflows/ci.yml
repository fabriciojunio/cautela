name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Estilo
        run: ruff check .

      # Nenhum teste toca a rede nem precisa de chave: o modelo entra por
      # injecao e o acervo e montado a partir de artefato em pasta temporaria.
      # Por isso o CI roda a suite inteira sem segredo nenhum configurado.
      - name: Testes
        run: pytest -q
