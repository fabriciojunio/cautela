name: ci

on:
  push:
    branches: ["produção", "homologação"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Estilo
        run: ruff check .

      # Nenhum teste toca a rede nem precisa de chave: o modelo entra por
      # injecao e o acervo e montado a partir de artefato em pasta temporaria.
      # Por isso o CI roda a suite inteira sem segredo nenhum configurado.
      - name: Testes
        run: pytest -q
