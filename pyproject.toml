[project]
name = "cautela"
version = "0.1.0"
description = "Agente de investimentos que nao recomenda: responde com numero medido, fonte e limitacao"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langfuse>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Extras do rastro. Ficam separados porque o agente responde sem eles, e quem
# so quer rodar a suite nao precisa baixar o agente do Datadog.
rastro = ["ddtrace>=3.0", "python-dotenv>=1.0"]

# Sem isto, o setuptools acha duas raizes no diretorio (cautela e testes) e se
# recusa a construir. Declarar o pacote e mais honesto que mover a pasta de
# teste para dentro do codigo so para agradar a descoberta automatica.
[tool.setuptools.packages.find]
include = ["cautela*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["testes"]
